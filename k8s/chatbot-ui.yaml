apiVersion: v1
kind: Namespace
metadata:
  name: chatbot-ui
---
apiVersion: v1
kind: Secret
metadata:
  namespace: chatbot-ui
  name: chatbot-ui
type: Opaque
data:
  OPENAI_API_KEY: NmMwMmFjYWY0Ym1zaGI5ODI4ODk3Y2JkYmYzZnAxYTY0NDRqc25hY2YwMjZmNjJmMjQK
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: chatbot-ui
  name: chatbot-ui
  labels:
    app: chatbot-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-ui
  template:
    metadata:
      labels:
        app: chatbot-ui
    spec:
      imagePullSecrets:
        - name: my-dockerhub-secret
      containers:
        - name: chatbot-ui
          image: omarfr96/chatbot:latest
          resources: {}
          ports:
            - containerPort: 3000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatbot-ui
                  key: OPENAI_API_KEY
---
kind: Service
apiVersion: v1
metadata:
  namespace: chatbot-ui
  name: chatbot-ui
  labels:
    app: chatbot-ui
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  selector:
    app: chatbot-ui
  type: ClusterIP
